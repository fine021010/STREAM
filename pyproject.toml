[build-system]
requires = ["setuptools>=67.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topo-build"
version = "0.1.0"
description = "Build directed station topology from river and station Shapefiles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.3",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "shapely>=2.0.6",
]

[tool.setuptools]
packages = ["topo_build"]
py-modules = ["river_topo_build"]

[tool.setuptools.package-dir]
topo_build = "src/topo_build"
